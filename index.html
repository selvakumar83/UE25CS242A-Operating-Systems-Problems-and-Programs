<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#075985">

<title>
Operating Systems - Problems & Programs
</title>


<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #f1f5f9;

    color:
        #222;

}


/* =====================================================
   HEADER
   ===================================================== */

.header {

    background:
        linear-gradient(
            135deg,
            #075985,
            #0369a1
        );

    color:
        white;

    text-align:
        center;

    padding:
        25px 15px 28px;

    border-radius:
        0 0 25px 25px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.15);

}

.header h1 {

    margin:
        0;

    font-size:
        28px;

    font-weight:
        700;

}

.header p {

    margin:
        8px 0 0;

    font-size:
        16px;

}


/* =====================================================
   CONTAINER
   ===================================================== */

.container {

    width:
        100%;

    max-width:
        720px;

    margin:
        auto;

    padding:
        12px;

}


/* =====================================================
   CARD
   ===================================================== */

.card {

    background:
        white;

    margin-top:
        18px;

    padding:
        20px;

    border-radius:
        18px;

    box-shadow:
        0 3px 15px
        rgba(0,0,0,0.08);

}


/* =====================================================
   LABEL
   ===================================================== */

.label {

    display:
        block;

    margin-bottom:
        9px;

    font-size:
        18px;

    font-weight:
        bold;

}


/* =====================================================
   PASSWORD INPUT
   ===================================================== */

#password {

    width:
        100%;

    height:
        56px;

    padding:
        10px 15px;

    border:
        1px solid #cbd5e1;

    border-radius:
        12px;

    font-size:
        18px;

    outline:
        none;

}


#password:focus {

    border:
        2px solid #0284c7;

}


/* =====================================================
   BUTTONS
   ===================================================== */

button {

    width:
        100%;

    min-height:
        52px;

    margin-top:
        12px;

    padding:
        12px;

    border:
        none;

    border-radius:
        12px;

    font-size:
        16px;

    font-weight:
        bold;

    cursor:
        pointer;

}


button:disabled {

    background:
        #94a3b8 !important;

    cursor:
        not-allowed;

}


/* =====================================================
   LOGIN BUTTON
   ===================================================== */

.submit-button {

    background:
        #0369a1;

    color:
        white;

}


/* =====================================================
   SELECT BUTTONS
   ===================================================== */

.select-button {

    background:
        #e2e8f0;

    color:
        #0f172a;

}


/* =====================================================
   DOWNLOAD BUTTON
   ===================================================== */

.download-button {

    background:
        #15803d;

    color:
        white;

}


/* =====================================================
   WELCOME
   ===================================================== */

.welcome {

    background:
        #e0f2fe;

    color:
        #075985;

    padding:
        14px;

    border-radius:
        12px;

    text-align:
        center;

    font-size:
        16px;

    font-weight:
        bold;

    margin-bottom:
        18px;

}


/* =====================================================
   FILE INFORMATION
   ===================================================== */

.file-info {

    text-align:
        center;

    color:
        #64748b;

    font-size:
        14px;

    margin:
        10px 0 18px;

}


/* =====================================================
   FILE LIST
   ===================================================== */

.file-list {

    width:
        100%;

    max-height:
        600px;

    overflow-y:
        auto;

    border:
        1px solid #e2e8f0;

    border-radius:
        12px;

    padding:
        0 10px;

}


/* =====================================================
   FILE ITEM
   ===================================================== */

.file-item {

    display:
        flex;

    align-items:
        center;

    width:
        100%;

    min-height:
        60px;

    padding:
        10px 4px;

    border-bottom:
        1px solid #e5e7eb;

}


.file-item:last-child {

    border-bottom:
        none;

}


/* =====================================================
   CHECKBOX
   ===================================================== */

.file-checkbox {

    appearance:
        none;

    -webkit-appearance:
        none;

    width:
        24px !important;

    height:
        24px;

    min-width:
        24px;

    margin:
        0 13px 0 0;

    border:
        2px solid #64748b;

    border-radius:
        6px;

    background:
        white;

    cursor:
        pointer;

    position:
        relative;

}


.file-checkbox:checked {

    background:
        #0284c7;

    border-color:
        #0284c7;

}


.file-checkbox:checked::after {

    content:
        "✓";

    color:
        white;

    position:
        absolute;

    font-size:
        17px;

    font-weight:
        bold;

    left:
        3px;

    top:
        -1px;

}


/* =====================================================
   FILE NAME
   ===================================================== */

.file-name {

    flex:
        1;

    font-size:
        15px;

    line-height:
        1.4;

    word-break:
        break-word;

    color:
        #1e293b;

}


/* =====================================================
   FILE TYPE
   ===================================================== */

.file-type {

    margin-left:
        8px;

    padding:
        4px 7px;

    border-radius:
        6px;

    background:
        #e0f2fe;

    color:
        #075985;

    font-size:
        10px;

    font-weight:
        bold;

    flex-shrink:
        0;

}


/* =====================================================
   SELECTED COUNT
   ===================================================== */

.selected-count {

    margin:
        17px 0;

    text-align:
        center;

    font-size:
        17px;

    font-weight:
        bold;

    color:
        #075985;

}


/* =====================================================
   STATUS
   ===================================================== */

.status {

    display:
        none;

    margin-top:
        13px;

    padding:
        13px;

    border-radius:
        10px;

    text-align:
        center;

    font-size:
        14px;

    line-height:
        1.4;

}


.status.info {

    display:
        block;

    background:
        #e0f2fe;

    color:
        #075985;

}


.status.success {

    display:
        block;

    background:
        #dcfce7;

    color:
        #166534;

}


.status.error {

    display:
        block;

    background:
        #fee2e2;

    color:
        #991b1b;

}


/* =====================================================
   FOOTER
   ===================================================== */

.footer {

    text-align:
        center;

    padding:
        30px 10px;

    color:
        #64748b;

    font-size:
        13px;

    line-height:
        1.7;

}


.copyright {

    margin-top:
        10px;

    font-size:
        12px;

    color:
        #475569;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

    .header {

        padding:
            23px 12px 26px;

    }


    .header h1 {

        font-size:
            23px;

    }


    .header p {

        font-size:
            14px;

    }


    .container {

        padding:
            10px;

    }


    .card {

        padding:
            16px;

    }


    #password {

        font-size:
            17px;

    }


    .file-list {

        max-height:
            500px;

    }


    .file-name {

        font-size:
            14px;

    }


    .file-type {

        font-size:
            9px;

    }


    button {

        font-size:
            15px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<div class="header">

    <h1>
        💻 Operating Systems
    </h1>

    <p>
        Problems & Programs
    </p>

</div>



<div class="container">


<!-- =====================================================
     PASSWORD CARD
     ===================================================== -->

<div
    id="loginCard"
    class="card"
>


    <label
        class="label"
        for="password">

        🔐 Enter Password

    </label>


    <input
        id="password"
        type="password"
        placeholder="Enter Password"
        autocomplete="off"
    >


    <button
        id="submitButton"
        class="submit-button"
        onclick="verifyPassword()">

        🔐 SUBMIT

    </button>


    <div
        id="status"
        class="status">

    </div>


</div>



<!-- =====================================================
     FILE CARD
     ===================================================== -->

<div
    id="fileCard"
    class="card"
    style="display:none;"
>


    <div
        class="welcome">

        ✅ Access Granted

    </div>


    <h2>
        📂 Available Files
    </h2>


    <div
        id="fileInfo"
        class="file-info">

    </div>


    <!-- SELECT ALL -->

    <button
        class="select-button"
        onclick="selectAllFiles()">

        ☑️ SELECT ALL

    </button>


    <!-- CLEAR ALL -->

    <button
        class="select-button"
        onclick="clearAllFiles()">

        ⬜ CLEAR ALL

    </button>


    <!-- COUNT -->

    <div
        id="selectedCount"
        class="selected-count">

        Selected Files: 0

    </div>


    <!-- FILE LIST -->

    <div
        id="fileList"
        class="file-list">

    </div>


    <!-- DOWNLOAD -->

    <button
        id="downloadButton"
        class="download-button"
        onclick="downloadSelectedFiles()"
        disabled>

        📥 DOWNLOAD SELECTED FILES

    </button>


</div>



<!-- =====================================================
     FOOTER
     ===================================================== -->

<div class="footer">

    <strong>
        3 Sem CSE (AI & ML)
    </strong>

    <br>

    Operating Systems

    <br>

    PES University


    <div class="copyright">

        © 2026 Selva Kumar. All Rights Reserved.

        <br>

        For Educational Use Only.

    </div>

</div>


</div>



<script>


/* =========================================================
   GITHUB CONFIGURATION
   ========================================================= */

const OWNER =
    "selvakumar83";


const REPOSITORY =
    "UE25CS242A-Operating-Systems-Problems-and-Programs";


const BRANCH =
    "main";


/* =========================================================
   COMMON PASSWORD
   ========================================================= */

const COMMON_PASSWORD =
    "PES EC";


/* =========================================================
   VARIABLES
   ========================================================= */

let availableFiles = [];


/* =========================================================
   VERIFY PASSWORD
   ========================================================= */

async function verifyPassword() {


    const passwordInput =
        document.getElementById(
            "password"
        );


    const password =
        passwordInput.value;


    /* -----------------------------------------------------
       Check password
       ----------------------------------------------------- */

    if (
        password !== COMMON_PASSWORD
    ) {

        showStatus(
            "❌ Incorrect password. Please try again.",
            "error"
        );

        passwordInput.focus();

        return;

    }


    /* -----------------------------------------------------
       Password correct
       ----------------------------------------------------- */

    const submitButton =
        document.getElementById(
            "submitButton"
        );


    submitButton.disabled =
        true;


    submitButton.textContent =
        "⏳ LOADING...";


    showStatus(
        "Password verified. Loading files...",
        "info"
    );


    /* -----------------------------------------------------
       Load repository files
       ----------------------------------------------------- */

    await loadFiles();


}


/* =========================================================
   LOAD ALL GITHUB FILES
   ========================================================= */

async function loadFiles() {


    try {


        /* =================================================
           GitHub Git Trees API

           recursive=1 means:

           Root files
           +
           Files inside folders
           +
           Files inside subfolders
           ================================================= */

        const apiURL =
            "https://api.github.com/repos/" +
            OWNER +
            "/" +
            REPOSITORY +
            "/git/trees/" +
            BRANCH +
            "?recursive=1";


        const response =
            await fetch(
                apiURL,
                {
                    cache:
                        "no-store",

                    headers: {
                        "Accept":
                            "application/vnd.github+json"
                    }
                }
            );


        /* =================================================
           ERROR HANDLING
           ================================================= */

        if (
            !response.ok
        ) {


            if (
                response.status ===
                403
            ) {

                throw new Error(
                    "GitHub request limit reached. " +
                    "Please try again later."
                );

            }


            if (
                response.status ===
                404
            ) {

                throw new Error(
                    "GitHub repository was not found."
                );

            }


            throw new Error(
                "GitHub returned error " +
                response.status
            );

        }


        /* =================================================
           READ JSON
           ================================================= */

        const data =
            await response.json();


        /* =================================================
           CHECK TREE
           ================================================= */

        if (
            !Array.isArray(
                data.tree
            )
        ) {

            throw new Error(
                "Unable to read repository files."
            );

        }


        /* =================================================
           CHECK TRUNCATED
           ================================================= */

        if (
            data.truncated === true
        ) {

            throw new Error(
                "The repository contains too many files."
            );

        }


        /* =================================================
           CLEAR OLD LIST
           ================================================= */

        availableFiles = [];


        /* =================================================
           READ EVERY FILE
           ================================================= */

        data.tree.forEach(
            function(item) {


                /*
                "blob" means file.

                "tree" means folder.
                */

                if (
                    item.type !==
                    "blob"
                ) {

                    return;

                }


                if (
                    !item.path
                ) {

                    return;

                }


                /* -----------------------------------------
                   Actual repository path
                   ----------------------------------------- */

                const filePath =
                    item.path;


                /* -----------------------------------------
                   Actual filename
                   ----------------------------------------- */

                const filename =
                    filePath
                    .split("/")
                    .pop();


                /* -----------------------------------------
                   Ignore only index.html

                   The webpage itself should not appear
                   as a downloadable teaching file.
                   ----------------------------------------- */

                if (
                    filename
                    .toLowerCase()
                    ===
                    "index.html"
                ) {

                    return;

                }


                /* -----------------------------------------
                   Extension
                   ----------------------------------------- */

                let extension =
                    "";


                const dot =
                    filename.lastIndexOf(".");


                if (
                    dot !== -1
                ) {

                    extension =
                        filename
                        .substring(
                            dot + 1
                        )
                        .toUpperCase();

                }


                /* -----------------------------------------
                   Encode path
                   ----------------------------------------- */

                const encodedPath =
                    filePath
                    .split("/")
                    .map(
                        function(part) {

                            return encodeURIComponent(
                                part
                            );

                        }
                    )
                    .join("/");


                /* -----------------------------------------
                   Direct raw GitHub URL
                   ----------------------------------------- */

                const downloadURL =
                    "https://raw.githubusercontent.com/" +
                    OWNER +
                    "/" +
                    REPOSITORY +
                    "/" +
                    BRANCH +
                    "/" +
                    encodedPath;


                /* -----------------------------------------
                   Add file
                   ----------------------------------------- */

                availableFiles.push({

                    name:
                        filename,

                    path:
                        filePath,

                    extension:
                        extension,

                    downloadURL:
                        downloadURL

                });

            }
        );


        /* =================================================
           SORT FILES
           ================================================= */

        availableFiles.sort(
            function(a, b) {

                return a.name.localeCompare(
                    b.name,
                    undefined,
                    {
                        numeric:
                            true,

                        sensitivity:
                            "base"
                    }
                );

            }
        );


        /* =================================================
           CHECK FILES
           ================================================= */

        if (
            availableFiles.length === 0
        ) {

            throw new Error(
                "No files found in the repository."
            );

        }


        /* =================================================
           DISPLAY
           ================================================= */

        displayFiles();


        /* =================================================
           HIDE LOGIN
           ================================================= */

        document
            .getElementById(
                "loginCard"
            )
            .style.display =
            "none";


        /* =================================================
           SHOW FILE CARD
           ================================================= */

        document
            .getElementById(
                "fileCard"
            )
            .style.display =
            "block";


        /* =================================================
           FILE COUNT
           ================================================= */

        document
            .getElementById(
                "fileInfo"
            )
            .textContent =
            availableFiles.length +
            " files available";


    }


    catch(error) {


        console.error(
            error
        );


        showStatus(
            "❌ " +
            error.message,
            "error"
        );


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        submitButton.disabled =
            false;


        submitButton.textContent =
            "🔐 SUBMIT";

    }

}


/* =========================================================
   DISPLAY FILES
   ========================================================= */

function displayFiles() {


    const fileList =
        document.getElementById(
            "fileList"
        );


    fileList.innerHTML =
        "";


    availableFiles.forEach(
        function(
            file,
            index
        ) {


            /* ---------------------------------------------
               ROW
               --------------------------------------------- */

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "file-item";


            /* ---------------------------------------------
               CHECKBOX
               --------------------------------------------- */

            const checkbox =
                document.createElement(
                    "input"
                );


            checkbox.type =
                "checkbox";


            checkbox.className =
                "file-checkbox";


            checkbox.dataset.index =
                index;


            checkbox.addEventListener(
                "change",
                updateSelectedCount
            );


            /* ---------------------------------------------
               ACTUAL FILE NAME
               --------------------------------------------- */

            const name =
                document.createElement(
                    "span"
                );


            name.className =
                "file-name";


            name.textContent =
                file.name;


            /* ---------------------------------------------
               FILE TYPE
               --------------------------------------------- */

            const type =
                document.createElement(
                    "span"
                );


            type.className =
                "file-type";


            type.textContent =
                file.extension ||
                "FILE";


            /* ---------------------------------------------
               ADD ELEMENTS
               --------------------------------------------- */

            row.appendChild(
                checkbox
            );


            row.appendChild(
                name
            );


            row.appendChild(
                type
            );


            fileList.appendChild(
                row
            );

        }
    );


    updateSelectedCount();

}


/* =========================================================
   SELECT ALL
   ========================================================= */

function selectAllFiles() {


    document
        .querySelectorAll(
            ".file-checkbox"
        )
        .forEach(
            function(checkbox) {

                checkbox.checked =
                    true;

            }
        );


    updateSelectedCount();

}


/* =========================================================
   CLEAR ALL
   ========================================================= */

function clearAllFiles() {


    document
        .querySelectorAll(
            ".file-checkbox"
        )
        .forEach(
            function(checkbox) {

                checkbox.checked =
                    false;

            }
        );


    updateSelectedCount();

}


/* =========================================================
   UPDATE SELECTED COUNT
   ========================================================= */

function updateSelectedCount() {


    const selected =
        document.querySelectorAll(
            ".file-checkbox:checked"
        );


    document
        .getElementById(
            "selectedCount"
        )
        .textContent =
        "Selected Files: " +
        selected.length;


    document
        .getElementById(
            "downloadButton"
        )
        .disabled =
        selected.length === 0;

}


/* =========================================================
   DOWNLOAD SELECTED FILES
   =========================================================

   IMPORTANT:

   Files are downloaded individually.

   NO ZIP.

   ========================================================= */

async function downloadSelectedFiles() {


    const selected =
        Array.from(
            document.querySelectorAll(
                ".file-checkbox:checked"
            )
        );


    /* -----------------------------------------------------
       Check selection
       ----------------------------------------------------- */

    if (
        selected.length === 0
    ) {

        alert(
            "Please select at least one file."
        );

        return;

    }


    const button =
        document.getElementById(
            "downloadButton"
        );


    button.disabled =
        true;


    /* =====================================================
       DOWNLOAD EACH FILE
       ===================================================== */

    for (
        let i = 0;
        i < selected.length;
        i++
    ) {


        /* ---------------------------------------------
           Get selected checkbox
           --------------------------------------------- */

        const checkbox =
            selected[i];


        /* ---------------------------------------------
           Get index
           --------------------------------------------- */

        const index =
            Number(
                checkbox.dataset.index
            );


        /* ---------------------------------------------
           Get file
           --------------------------------------------- */

        const file =
            availableFiles[index];


        /* ---------------------------------------------
           Show progress
           --------------------------------------------- */

        button.textContent =
            "⬇️ Downloading " +
            (i + 1) +
            " / " +
            selected.length;


        /* ---------------------------------------------
           Direct download link
           --------------------------------------------- */

        const link =
            document.createElement(
                "a"
            );


        link.href =
            file.downloadURL;


        /*
        Preserve original filename
        */

        link.download =
            file.name;


        link.target =
            "_blank";


        link.rel =
            "noopener";


        /* ---------------------------------------------
           Add link to page
           --------------------------------------------- */

        document
            .body
            .appendChild(
                link
            );


        /* ---------------------------------------------
           Start download
           --------------------------------------------- */

        link.click();


        /* ---------------------------------------------
           Remove link
           --------------------------------------------- */

        document
            .body
            .removeChild(
                link
            );


        /* ---------------------------------------------
           Wait before next download

           This helps mobile browsers.
           --------------------------------------------- */

        await delay(
            1200
        );

    }


    /* =====================================================
       RESET BUTTON
       ===================================================== */

    button.textContent =
        "📥 DOWNLOAD SELECTED FILES";


    button.disabled =
        false;


    showStatus(
        "Selected files sent for download.",
        "success"
    );

}


/* =========================================================
   DELAY
   ========================================================= */

function delay(
    milliseconds
) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                milliseconds
            );

        }
    );

}


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(
    message,
    type
) {


    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.className =
        "status " +
        type;


    status.style.display =
        "block";

}


/* =========================================================
   ENTER KEY
   ========================================================= */

document
    .getElementById(
        "password"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                verifyPassword();

            }

        }
    );

</script>


</body>

</html>
