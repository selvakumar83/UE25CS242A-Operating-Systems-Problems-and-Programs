<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#173f5f">

<title>
Operating Systems - Problems & Programs
</title>

<!-- ZIP library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f3f6f9;

    color: #222;

}

.header {

    background:
        linear-gradient(
            135deg,
            #173f5f,
            #20639b
        );

    color: white;

    text-align: center;

    padding: 25px 15px;

    border-radius:
        0 0 22px 22px;

}

.header h1 {

    margin: 0;

    font-size: 27px;

}

.header p {

    margin: 8px 0 0;

    font-size: 16px;

}

.container {

    width: 100%;

    max-width: 700px;

    margin: auto;

    padding: 12px;

}

.card {

    background: white;

    margin-top: 18px;

    padding: 18px;

    border-radius: 16px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);

}

.label {

    display: block;

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 9px;

}

#srn {

    width: 100%;

    padding: 15px;

    border:
        1px solid #ccc;

    border-radius: 10px;

    font-size: 17px;

    text-transform: uppercase;

    outline: none;

}

#srn:focus {

    border-color: #20639b;

}

button {

    width: 100%;

    min-height: 50px;

    border: none;

    border-radius: 10px;

    margin-top: 12px;

    padding: 12px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}

.submit-btn {

    background: #20639b;

    color: white;

}

.select-btn {

    background: #e9eef3;

    color: #173f5f;

}

.download-btn {

    background: #198754;

    color: white;

}

button:disabled {

    background: #aaa;

}

.status {

    margin-top: 12px;

    padding: 12px;

    border-radius: 10px;

    text-align: center;

    display: none;

}

.status.success {

    display: block;

    background: #e8f7ee;

    color: #126b3d;

}

.status.error {

    display: block;

    background: #fdecec;

    color: #a12626;

}

.status.info {

    display: block;

    background: #eaf2fb;

    color: #174a70;

}

.welcome {

    background: #eaf5ff;

    color: #174a70;

    padding: 13px;

    border-radius: 10px;

    text-align: center;

    font-weight: bold;

}

.category {

    margin-top: 22px;

    margin-bottom: 8px;

    padding: 11px;

    border-radius: 9px;

    background: #f0f4f8;

    color: #173f5f;

    font-size: 18px;

    font-weight: bold;

}

.file-item {

    display: flex;

    align-items: center;

    padding: 13px 5px;

    border-bottom:
        1px solid #eee;

}

.file-checkbox {

    width: 22px !important;

    height: 22px;

    margin: 0 12px 0 0;

    flex-shrink: 0;

}

.file-name {

    font-size: 15px;

    line-height: 1.4;

    word-break: break-word;

}

.selected-count {

    text-align: center;

    font-weight: bold;

    color: #173f5f;

    margin: 16px 0;

}

.loading {

    text-align: center;

    padding: 25px;

    color: #666;

}

.footer {

    text-align: center;

    padding: 25px 10px;

    color: #666;

    font-size: 13px;

    line-height: 1.7;

}

@media(max-width:600px) {

    .header h1 {

        font-size: 23px;

    }

    .header p {

        font-size: 14px;

    }

    .card {

        padding: 15px;

    }

    .category {

        font-size: 17px;

    }

    .file-name {

        font-size: 14px;

    }

    button {

        font-size: 15px;

    }

}

</style>

</head>


<body>


<div class="header">

<h1>
💻 Operating Systems
</h1>

<p>
Problems & Programs
</p>

</div>


<div class="container">


<!-- SRN -->

<div class="card">

<label class="label">
Enter Your SRN
</label>

<input
    type="text"
    id="srn"
    placeholder="Example: PES1UG23CS001"
    autocomplete="off"
>

<button
    class="submit-btn"
    onclick="loadFiles()">

🔍 SUBMIT

</button>

<div
    id="status"
    class="status">
</div>

</div>


<!-- FILES -->

<div
    class="card"
    id="fileCard"
    style="display:none;"
>

<div
    class="welcome"
    id="welcome">
</div>


<h2>
📂 Available Files
</h2>

<p>
Select the files you need to download.
</p>


<button
    class="select-btn"
    onclick="selectAll()">

☑️ SELECT ALL

</button>


<button
    class="select-btn"
    onclick="clearAll()">

⬜ CLEAR ALL

</button>


<div
    class="selected-count"
    id="selectedCount">

Selected Files: 0

</div>


<div
    id="fileList">

</div>


<button
    class="download-btn"
    id="downloadButton"
    onclick="downloadFiles()"
    disabled>

📦 DOWNLOAD SELECTED FILES

</button>

</div>


<!-- FOOTER -->

<div class="footer">

<strong>
3 Sem CSE (AI & ML)
</strong>

<br>

Operating Systems

<br>

PES University

</div>


</div>


<script>


/*
========================================================
GITHUB INFORMATION
========================================================
*/

const OWNER =
"selvakumar83";

const REPOSITORY =
"UE25CS242A-Operating-Systems-Problems-and-Programs";

const BRANCH =
"main";


/*
========================================================
FILES.JSON URL
========================================================
*/

const FILE_LIST_URL =
`https://raw.githubusercontent.com/${OWNER}/${REPOSITORY}/${BRANCH}/files.json`;


/*
========================================================
VARIABLES
========================================================
*/

let files = [];

let studentSRN = "";


/*
========================================================
LOAD FILES
========================================================
*/

async function loadFiles() {


    studentSRN =
        document
        .getElementById("srn")
        .value
        .trim()
        .toUpperCase();


    if (studentSRN === "") {

        showStatus(
            "Please enter your SRN.",
            "error"
        );

        return;

    }


    showStatus(
        "Loading files...",
        "info"
    );


    try {


        /*
        Get files.json
        */

        const response =
            await fetch(
                FILE_LIST_URL +
                "?v=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "files.json could not be loaded."
            );

        }


        files =
            await response.json();


        if (
            !Array.isArray(files) ||
            files.length === 0
        ) {

            throw new Error(
                "No files available."
            );

        }


        /*
        Display files
        */

        displayFiles();


        /*
        Show card
        */

        document
        .getElementById("fileCard")
        .style.display =
        "block";


        /*
        Welcome
        */

        document
        .getElementById("welcome")
        .textContent =
        `Welcome, ${studentSRN}`;


        showStatus(
            `${files.length} files available.`,
            "success"
        );

    }


    catch(error) {

        console.error(error);

        showStatus(
            "Unable to load files. Please try again.",
            "error"
        );

    }

}


/*
========================================================
DISPLAY FILES
========================================================
*/

function displayFiles() {


    const fileList =
        document
        .getElementById("fileList");


    fileList.innerHTML = "";


    let currentCategory = "";


    files.forEach(
        (file, index) => {


            /*
            Category
            */

            if (
                file.category !==
                currentCategory
            ) {


                currentCategory =
                    file.category;


                const category =
                    document
                    .createElement("div");


                category.className =
                    "category";


                category.textContent =
                    currentCategory;


                fileList.appendChild(
                    category
                );

            }


            /*
            File row
            */

            const row =
                document
                .createElement("div");


            row.className =
                "file-item";


            /*
            Checkbox
            */

            const checkbox =
                document
                .createElement("input");


            checkbox.type =
                "checkbox";


            checkbox.className =
                "file-checkbox";


            checkbox.dataset.index =
                index;


            checkbox.addEventListener(
                "change",
                updateCount
            );


            /*
            File name
            */

            const name =
                document
                .createElement("span");


            name.className =
                "file-name";


            name.textContent =
                file.name;


            /*
            Add
            */

            row.appendChild(
                checkbox
            );


            row.appendChild(
                name
            );


            fileList.appendChild(
                row
            );

        }
    );

}


/*
========================================================
SELECT ALL
========================================================
*/

function selectAll() {


    document
    .querySelectorAll(
        ".file-checkbox"
    )
    .forEach(
        checkbox => {

            checkbox.checked =
            true;

        }
    );


    updateCount();

}


/*
========================================================
CLEAR ALL
========================================================
*/

function clearAll() {


    document
    .querySelectorAll(
        ".file-checkbox"
    )
    .forEach(
        checkbox => {

            checkbox.checked =
            false;

        }
    );


    updateCount();

}


/*
========================================================
COUNT
========================================================
*/

function updateCount() {


    const selected =
        document
        .querySelectorAll(
            ".file-checkbox:checked"
        );


    const count =
        selected.length;


    document
    .getElementById("selectedCount")
    .textContent =
    `Selected Files: ${count}`;


    document
    .getElementById("downloadButton")
    .disabled =
    count === 0;

}


/*
========================================================
DOWNLOAD SELECTED FILES
========================================================
*/

async function downloadFiles() {


    const selected =
        Array.from(
            document.querySelectorAll(
                ".file-checkbox:checked"
            )
        );


    if (
        selected.length === 0
    ) {

        alert(
            "Please select at least one file."
        );

        return;

    }


    const button =
        document
        .getElementById(
            "downloadButton"
        );


    button.disabled =
    true;


    try {


        const zip =
            new JSZip();


        for (
            let i = 0;
            i < selected.length;
            i++
        ) {


            const checkbox =
                selected[i];


            const index =
                parseInt(
                    checkbox.dataset.index
                );


            const file =
                files[index];


            /*
            Raw GitHub URL
            */

            const url =
            `https://raw.githubusercontent.com/` +
            `${OWNER}/` +
            `${REPOSITORY}/` +
            `${BRANCH}/` +
            `${file.file}`;


            button.textContent =
            `⏳ Downloading ${i + 1}/${selected.length}`;


            /*
            Fetch file
            */

            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    file.name
                );

            }


            const blob =
                await response.blob();


            /*
            Put inside ZIP
            */

            zip.file(
                file.name,
                blob
            );

        }


        /*
        Create ZIP
        */

        button.textContent =
        "⏳ Creating ZIP...";


        const zipBlob =
            await zip.generateAsync(
                {
                    type: "blob",

                    compression:
                    "DEFLATE",

                    compressionOptions:
                    {
                        level: 6
                    }
                }
            );


        /*
        Download ZIP
        */

        const url =
            URL.createObjectURL(
                zipBlob
            );


        const link =
            document
            .createElement("a");


        link.href =
        url;


        link.download =
        `${studentSRN}_OS_Materials.zip`;


        document
        .body
        .appendChild(link);


        link.click();


        document
        .body
        .removeChild(link);


        URL.revokeObjectURL(
            url
        );


        button.textContent =
        "📦 DOWNLOAD SELECTED FILES";


        button.disabled =
        false;


        showStatus(
            "ZIP downloaded successfully.",
            "success"
        );

    }


    catch(error) {

        console.error(error);


        alert(
            "Unable to download one of the selected files."
        );


        button.textContent =
        "📦 DOWNLOAD SELECTED FILES";


        button.disabled =
        false;

    }

}


/*
========================================================
STATUS
========================================================
*/

function showStatus(
    message,
    type
) {


    const status =
        document
        .getElementById("status");


    status.textContent =
    message;


    status.className =
    `status ${type}`;


    status.style.display =
    "block";

}


/*
========================================================
ENTER KEY
========================================================
*/

document
.getElementById("srn")
.addEventListener(
    "keypress",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            loadFiles();

        }

    }
);

</script>

</body>

</html>
