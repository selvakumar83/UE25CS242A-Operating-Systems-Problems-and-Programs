<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#075985">

<title>
Operating Systems - Problems & Programs
</title>


<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}


html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
}


body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f1f5f9;

    color: #222;

}


/* =====================================================
   HEADER
   ===================================================== */

.header {

    background:
        linear-gradient(
            135deg,
            #075985,
            #0369a1
        );

    color: white;

    text-align: center;

    padding:
        25px 15px 28px;

    border-radius:
        0 0 25px 25px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.15);

}


.header h1 {

    margin: 0;

    font-size: 27px;

}


.header p {

    margin:
        8px 0 0;

    font-size: 16px;

}


/* =====================================================
   MAIN CONTAINER
   ===================================================== */

.container {

    width: 100%;

    max-width: 700px;

    margin: auto;

    padding: 12px;

}


/* =====================================================
   CARD
   ===================================================== */

.card {

    background: white;

    margin-top: 18px;

    padding: 20px;

    border-radius: 18px;

    box-shadow:
        0 3px 15px
        rgba(0,0,0,0.08);

}


/* =====================================================
   SRN
   ===================================================== */

.label {

    display: block;

    margin-bottom: 9px;

    font-size: 18px;

    font-weight: bold;

}


#srn {

    width: 100%;

    height: 55px;

    padding:
        10px 15px;

    border:
        1px solid #cbd5e1;

    border-radius: 12px;

    font-size: 18px;

    text-transform: uppercase;

    outline: none;

}


#srn:focus {

    border:
        2px solid #0284c7;

}


/* =====================================================
   BUTTONS
   ===================================================== */

button {

    width: 100%;

    min-height: 52px;

    margin-top: 12px;

    padding: 12px;

    border: none;

    border-radius: 12px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


button:disabled {

    background:
        #94a3b8 !important;

    cursor: not-allowed;

}


.submit-button {

    background:
        #0369a1;

    color: white;

}


.select-button {

    background:
        #e2e8f0;

    color:
        #0f172a;

}


.download-button {

    background:
        #15803d;

    color: white;

}


/* =====================================================
   WELCOME
   ===================================================== */

.welcome {

    background:
        #e0f2fe;

    color:
        #075985;

    padding:
        14px;

    border-radius:
        12px;

    text-align:
        center;

    font-size:
        16px;

    font-weight:
        bold;

    margin-bottom:
        18px;

}


/* =====================================================
   FILE INFORMATION
   ===================================================== */

.file-info {

    text-align:
        center;

    color:
        #64748b;

    font-size:
        14px;

    margin:
        10px 0 18px;

}


/* =====================================================
   FILE ITEM
   ===================================================== */

.file-item {

    display:
        flex;

    align-items:
        center;

    min-height:
        58px;

    padding:
        10px 4px;

    border-bottom:
        1px solid #e5e7eb;

}


.file-checkbox {

    appearance:
        none;

    -webkit-appearance:
        none;

    width:
        24px !important;

    height:
        24px;

    min-width:
        24px;

    margin:
        0 13px 0 0;

    border:
        2px solid #64748b;

    border-radius:
        6px;

    background:
        white;

    cursor:
        pointer;

}


.file-checkbox:checked {

    background:
        #0284c7;

    border-color:
        #0284c7;

    position:
        relative;

}


.file-checkbox:checked::after {

    content:
        "✓";

    color:
        white;

    position:
        absolute;

    font-size:
        17px;

    font-weight:
        bold;

    left:
        3px;

    top:
        -1px;

}


.file-name {

    flex: 1;

    font-size:
        15px;

    line-height:
        1.4;

    word-break:
        break-word;

}


/* =====================================================
   FILE TYPE
   ===================================================== */

.file-type {

    margin-left:
        8px;

    padding:
        4px 7px;

    border-radius:
        6px;

    background:
        #e0f2fe;

    color:
        #075985;

    font-size:
        10px;

    font-weight:
        bold;

    flex-shrink:
        0;

}


/* =====================================================
   SELECTED COUNT
   ===================================================== */

.selected-count {

    margin:
        17px 0;

    text-align:
        center;

    font-size:
        17px;

    font-weight:
        bold;

    color:
        #075985;

}


/* =====================================================
   STATUS
   ===================================================== */

.status {

    display:
        none;

    margin-top:
        13px;

    padding:
        13px;

    border-radius:
        10px;

    text-align:
        center;

    font-size:
        14px;

    line-height:
        1.4;

}


.status.info {

    display:
        block;

    background:
        #e0f2fe;

    color:
        #075985;

}


.status.success {

    display:
        block;

    background:
        #dcfce7;

    color:
        #166534;

}


.status.error {

    display:
        block;

    background:
        #fee2e2;

    color:
        #991b1b;

}


/* =====================================================
   LOADING
   ===================================================== */

.loading {

    text-align:
        center;

    padding:
        25px 10px;

    color:
        #64748b;

}


/* =====================================================
   FOOTER
   ===================================================== */

.footer {

    text-align:
        center;

    padding:
        30px 10px;

    color:
        #64748b;

    font-size:
        14px;

    line-height:
        1.7;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {


    .header h1 {

        font-size:
            23px;

    }


    .header p {

        font-size:
            14px;

    }


    .container {

        padding:
            10px;

    }


    .card {

        padding:
            16px;

    }


    .file-name {

        font-size:
            14px;

    }


    .file-type {

        font-size:
            9px;

    }


    button {

        font-size:
            15px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<div class="header">

    <h1>
        💻 Operating Systems
    </h1>

    <p>
        Problems & Programs
    </p>

</div>


<div class="container">


<!-- =====================================================
     SRN CARD
     ===================================================== -->

<div class="card">

    <label
        class="label"
        for="srn">

        Enter Your SRN

    </label>


    <input
        id="srn"
        type="text"
        placeholder="Example: PES1UG23CS001"
        autocomplete="off"
        autocapitalize="characters"
    >


    <button
        id="submitButton"
        class="submit-button"
        onclick="loadFiles()">

        🔍 SUBMIT

    </button>


    <div
        id="status"
        class="status">

    </div>

</div>


<!-- =====================================================
     FILE CARD
     ===================================================== -->

<div
    id="fileCard"
    class="card"
    style="display:none;"
>


    <div
        id="welcome"
        class="welcome">

    </div>


    <h2>
        📂 Available Files
    </h2>


    <div
        id="fileInfo"
        class="file-info">

    </div>


    <!-- SELECT ALL -->

    <button
        class="select-button"
        onclick="selectAllFiles()">

        ☑️ SELECT ALL

    </button>


    <!-- CLEAR ALL -->

    <button
        class="select-button"
        onclick="clearAllFiles()">

        ⬜ CLEAR ALL

    </button>


    <!-- COUNT -->

    <div
        id="selectedCount"
        class="selected-count">

        Selected Files: 0

    </div>


    <!-- FILE LIST -->

    <div
        id="fileList">

    </div>


    <!-- DOWNLOAD -->

    <button
        id="downloadButton"
        class="download-button"
        onclick="downloadSelectedFiles()"
        disabled>

        📥 DOWNLOAD SELECTED FILES

    </button>


</div>


<!-- =====================================================
     FOOTER
     ===================================================== -->

<div class="footer">

    <strong>
        3 Sem CSE (AI & ML)
    </strong>

    <br>

    Operating Systems

    <br>

    PES University

</div>


</div>



<script>


/* =========================================================
   GITHUB CONFIGURATION
   ========================================================= */


const OWNER =
    "selvakumar83";


const REPOSITORY =
    "UE25CS242A-Operating-Systems-Problems-and-Programs";


const BRANCH =
    "main";


/* =========================================================
   SUPPORTED FILE TYPES
   ========================================================= */


const SUPPORTED_EXTENSIONS = [

    "pdf",

    "doc",

    "docx"

];


/* =========================================================
   VARIABLES
   ========================================================= */


let availableFiles = [];

let studentSRN = "";


/* =========================================================
   LOAD REPOSITORY FILES
   ========================================================= */


async function loadFiles() {


    /* -----------------------------------------------
       Get SRN
       ----------------------------------------------- */

    studentSRN =
        document
        .getElementById("srn")
        .value
        .trim()
        .toUpperCase();


    /* -----------------------------------------------
       Validate SRN
       ----------------------------------------------- */

    if (
        studentSRN === ""
    ) {

        showStatus(
            "Please enter your SRN.",
            "error"
        );

        return;

    }


    /* -----------------------------------------------
       Loading state
       ----------------------------------------------- */

    const submitButton =
        document.getElementById(
            "submitButton"
        );


    submitButton.disabled =
        true;


    submitButton.textContent =
        "⏳ LOADING...";


    showStatus(
        "Reading files from GitHub...",
        "info"
    );


    try {


        /*
        =================================================
        Get repository root
        =================================================
        */

        const rootURL =
            "https://api.github.com/repos/" +
            OWNER +
            "/" +
            REPOSITORY +
            "/contents/?ref=" +
            BRANCH;


        const response =
            await fetch(
                rootURL,
                {
                    headers: {
                        "Accept":
                            "application/vnd.github+json"
                    }
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Unable to access GitHub."
            );

        }


        const rootItems =
            await response.json();


        /*
        =================================================
        Clear previous files
        =================================================
        */

        availableFiles = [];


        /*
        =================================================
        Read everything
        =================================================
        */

        for (
            const item of rootItems
        ) {


            /*
            Ignore index.html
            */

            if (
                item.name
                .toLowerCase()
                ===
                "index.html"
            ) {

                continue;

            }


            /*
            Ignore README
            */

            if (
                item.name
                .toLowerCase()
                ===
                "readme.md"
            ) {

                continue;

            }


            /*
            File
            */

            if (
                item.type ===
                "file"
            ) {

                addSupportedFile(
                    item
                );

            }


            /*
            Folder

            Search inside it.
            */

            else if (
                item.type ===
                "dir"
            ) {

                await readFolder(
                    item.path
                );

            }

        }


        /*
        =================================================
        No files
        =================================================
        */

        if (
            availableFiles.length === 0
        ) {

            throw new Error(
                "No PDF or Word files found."
            );

        }


        /*
        =================================================
        Sort by actual filename
        =================================================
        */

        availableFiles.sort(
            function(a, b) {

                return a.name
                    .localeCompare(
                        b.name,
                        undefined,
                        {
                            numeric: true,
                            sensitivity:
                                "base"
                        }
                    );

            }
        );


        /*
        =================================================
        Display
        =================================================
        */

        displayFiles();


        /*
        =================================================
        Show file card
        =================================================
        */

        document
            .getElementById(
                "fileCard"
            )
            .style.display =
            "block";


        /*
        =================================================
        Welcome
        =================================================
        */

        document
            .getElementById(
                "welcome"
            )
            .textContent =
            "Welcome, " +
            studentSRN;


        /*
        =================================================
        File count
        =================================================
        */

        document
            .getElementById(
                "fileInfo"
            )
            .textContent =
            availableFiles.length +
            " files available";


        /*
        =================================================
        Success
        =================================================
        */

        showStatus(
            "Files loaded successfully.",
            "success"
        );

    }


    catch(error) {


        console.error(
            error
        );


        showStatus(
            "Unable to load files from GitHub. " +
            "Please try again.",
            "error"
        );

    }


    finally {


        submitButton.disabled =
            false;


        submitButton.textContent =
            "🔍 SUBMIT";

    }

}


/* =========================================================
   READ FOLDER RECURSIVELY
   ========================================================= */


async function readFolder(
    folderPath
) {


    const folderURL =
        "https://api.github.com/repos/" +
        OWNER +
        "/" +
        REPOSITORY +
        "/contents/" +
        encodePath(
            folderPath
        ) +
        "?ref=" +
        BRANCH;


    const response =
        await fetch(
            folderURL,
            {
                headers: {
                    "Accept":
                        "application/vnd.github+json"
                }
            }
        );


    if (
        !response.ok
    ) {

        return;

    }


    const items =
        await response.json();


    for (
        const item of items
    ) {


        /*
        File
        */

        if (
            item.type ===
            "file"
        ) {

            addSupportedFile(
                item
            );

        }


        /*
        Folder
        */

        else if (
            item.type ===
            "dir"
        ) {

            await readFolder(
                item.path
            );

        }

    }

}


/* =========================================================
   ADD SUPPORTED FILE
   ========================================================= */


function addSupportedFile(
    item
) {


    const filename =
        item.name;


    const dot =
        filename.lastIndexOf(".");


    if (
        dot === -1
    ) {

        return;

    }


    const extension =
        filename
        .substring(
            dot + 1
        )
        .toLowerCase();


    /*
    Only PDF / DOC / DOCX
    */

    if (
        !SUPPORTED_EXTENSIONS
            .includes(
                extension
            )
    ) {

        return;

    }


    /*
    Avoid duplicate files
    */

    const alreadyExists =
        availableFiles.some(
            function(file) {

                return (
                    file.path ===
                    item.path
                );

            }
        );


    if (
        alreadyExists
    ) {

        return;

    }


    availableFiles.push({

        /*
        EXACT GitHub filename
        */

        name:
            item.name,

        /*
        Full repository path
        */

        path:
            item.path,

        /*
        Direct GitHub download URL
        */

        download_url:
            item.download_url,

        /*
        Extension
        */

        extension:
            extension

    });

}


/* =========================================================
   ENCODE FOLDER PATH
   ========================================================= */


function encodePath(
    path
) {


    return path
        .split("/")
        .map(
            function(part) {

                return encodeURIComponent(
                    part
                );

            }
        )
        .join("/");

}


/* =========================================================
   DISPLAY FILES
   ========================================================= */


function displayFiles() {


    const fileList =
        document.getElementById(
            "fileList"
        );


    fileList.innerHTML =
        "";


    /*
    =====================================================
    Display every file
    =====================================================
    */

    availableFiles.forEach(
        function(file, index) {


            /*
            File row
            */

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "file-item";


            /*
            Checkbox
            */

            const checkbox =
                document.createElement(
                    "input"
                );


            checkbox.type =
                "checkbox";


            checkbox.className =
                "file-checkbox";


            checkbox.dataset.index =
                index;


            checkbox.addEventListener(
                "change",
                updateSelectedCount
            );


            /*
            EXACT filename
            */

            const name =
                document.createElement(
                    "span"
                );


            name.className =
                "file-name";


            name.textContent =
                file.name;


            /*
            File extension
            */

            const type =
                document.createElement(
                    "span"
                );


            type.className =
                "file-type";


            type.textContent =
                file.extension
                .toUpperCase();


            /*
            Add
            */

            row.appendChild(
                checkbox
            );


            row.appendChild(
                name
            );


            row.appendChild(
                type
            );


            fileList.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   SELECT ALL
   ========================================================= */


function selectAllFiles() {


    document
        .querySelectorAll(
            ".file-checkbox"
        )
        .forEach(
            function(checkbox) {

                checkbox.checked =
                    true;

            }
        );


    updateSelectedCount();

}


/* =========================================================
   CLEAR ALL
   ========================================================= */


function clearAllFiles() {


    document
        .querySelectorAll(
            ".file-checkbox"
        )
        .forEach(
            function(checkbox) {

                checkbox.checked =
                    false;

            }
        );


    updateSelectedCount();

}


/* =========================================================
   UPDATE COUNT
   ========================================================= */


function updateSelectedCount() {


    const selected =
        document.querySelectorAll(
            ".file-checkbox:checked"
        );


    document
        .getElementById(
            "selectedCount"
        )
        .textContent =
        "Selected Files: " +
        selected.length;


    document
        .getElementById(
            "downloadButton"
        )
        .disabled =
        selected.length === 0;

}


/* =========================================================
   DIRECT DOWNLOAD
   ========================================================= */


async function downloadSelectedFiles() {


    const selected =
        Array.from(
            document.querySelectorAll(
                ".file-checkbox:checked"
            )
        );


    if (
        selected.length === 0
    ) {

        alert(
            "Please select at least one file."
        );

        return;

    }


    const button =
        document.getElementById(
            "downloadButton"
        );


    button.disabled =
        true;


    /*
    =====================================================
    Download each selected file directly
    =====================================================
    */

    for (
        let i = 0;
        i < selected.length;
        i++
    ) {


        const checkbox =
            selected[i];


        const index =
            Number(
                checkbox.dataset.index
            );


        const file =
            availableFiles[index];


        /*
        Progress
        */

        button.textContent =
            "⬇️ Downloading " +
            (i + 1) +
            " / " +
            selected.length;


        /*
        Direct GitHub URL
        */

        const link =
            document.createElement(
                "a"
            );


        link.href =
            file.download_url;


        link.download =
            file.name;


        link.target =
            "_blank";


        link.rel =
            "noopener";


        document
            .body
            .appendChild(
                link
            );


        link.click();


        document
            .body
            .removeChild(
                link
            );


        /*
        Delay between downloads
        */

        await delay(
            1000
        );

    }


    /*
    Reset
    */

    button.textContent =
        "📥 DOWNLOAD SELECTED FILES";


    button.disabled =
        false;


    showStatus(
        "Selected files downloaded.",
        "success"
    );

}


/* =========================================================
   DELAY
   ========================================================= */


function delay(
    milliseconds
) {


    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                milliseconds
            );

        }
    );

}


/* =========================================================
   STATUS
   ========================================================= */


function showStatus(
    message,
    type
) {


    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.className =
        "status " +
        type;


    status.style.display =
        "block";

}


/* =========================================================
   ENTER KEY
   ========================================================= */


document
    .getElementById(
        "srn"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                loadFiles();

            }

        }
    );

</script>


</body>

</html>
