<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#075985">

<title>
Operating Systems - Problems & Programs
</title>


<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #f1f5f9;

    color:
        #222;

}


/* =====================================================
   HEADER
   ===================================================== */

.header {

    background:
        linear-gradient(
            135deg,
            #075985,
            #0369a1
        );

    color:
        white;

    text-align:
        center;

    padding:
        25px 15px 28px;

    border-radius:
        0 0 25px 25px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.15);

}

.header h1 {

    margin:
        0;

    font-size:
        28px;

}

.header p {

    margin:
        8px 0 0;

    font-size:
        16px;

}


/* =====================================================
   MAIN CONTAINER
   ===================================================== */

.container {

    width:
        100%;

    max-width:
        700px;

    margin:
        auto;

    padding:
        12px;

}


/* =====================================================
   CARD
   ===================================================== */

.card {

    background:
        white;

    margin-top:
        18px;

    padding:
        20px;

    border-radius:
        18px;

    box-shadow:
        0 3px 15px
        rgba(0,0,0,0.08);

}


/* =====================================================
   LABEL
   ===================================================== */

.label {

    display:
        block;

    margin-bottom:
        9px;

    font-size:
        18px;

    font-weight:
        bold;

}


/* =====================================================
   SRN INPUT
   ===================================================== */

#srn {

    width:
        100%;

    height:
        56px;

    padding:
        10px 15px;

    border:
        1px solid #cbd5e1;

    border-radius:
        12px;

    font-size:
        18px;

    text-transform:
        uppercase;

    letter-spacing:
        0.5px;

    outline:
        none;

}


#srn:focus {

    border:
        2px solid #0284c7;

}


/* =====================================================
   BUTTONS
   ===================================================== */

button {

    width:
        100%;

    min-height:
        52px;

    margin-top:
        12px;

    padding:
        12px;

    border:
        none;

    border-radius:
        12px;

    font-size:
        16px;

    font-weight:
        bold;

    cursor:
        pointer;

}


button:disabled {

    background:
        #94a3b8 !important;

    cursor:
        not-allowed;

}


/* =====================================================
   SUBMIT BUTTON
   ===================================================== */

.submit-button {

    background:
        #0369a1;

    color:
        white;

}


/* =====================================================
   SELECT BUTTONS
   ===================================================== */

.select-button {

    background:
        #e2e8f0;

    color:
        #0f172a;

}


/* =====================================================
   DOWNLOAD BUTTON
   ===================================================== */

.download-button {

    background:
        #15803d;

    color:
        white;

}


/* =====================================================
   WELCOME
   ===================================================== */

.welcome {

    background:
        #e0f2fe;

    color:
        #075985;

    padding:
        14px;

    border-radius:
        12px;

    text-align:
        center;

    font-size:
        16px;

    font-weight:
        bold;

    margin-bottom:
        18px;

}


/* =====================================================
   FILE INFORMATION
   ===================================================== */

.file-info {

    text-align:
        center;

    color:
        #64748b;

    font-size:
        14px;

    margin:
        10px 0 18px;

}


/* =====================================================
   FILE LIST
   ===================================================== */

.file-list {

    width:
        100%;

}


/* =====================================================
   FILE ITEM
   ===================================================== */

.file-item {

    display:
        flex;

    align-items:
        center;

    width:
        100%;

    min-height:
        60px;

    padding:
        10px 4px;

    border-bottom:
        1px solid #e5e7eb;

}


/* =====================================================
   CHECKBOX
   ===================================================== */

.file-checkbox {

    appearance:
        none;

    -webkit-appearance:
        none;

    width:
        24px !important;

    height:
        24px;

    min-width:
        24px;

    margin:
        0 13px 0 0;

    border:
        2px solid #64748b;

    border-radius:
        6px;

    background:
        white;

    cursor:
        pointer;

    position:
        relative;

}


.file-checkbox:checked {

    background:
        #0284c7;

    border-color:
        #0284c7;

}


.file-checkbox:checked::after {

    content:
        "✓";

    color:
        white;

    position:
        absolute;

    font-size:
        17px;

    font-weight:
        bold;

    left:
        3px;

    top:
        -1px;

}


/* =====================================================
   FILE NAME
   ===================================================== */

.file-name {

    flex:
        1;

    font-size:
        15px;

    line-height:
        1.4;

    word-break:
        break-word;

}


/* =====================================================
   FILE TYPE
   ===================================================== */

.file-type {

    margin-left:
        8px;

    padding:
        4px 7px;

    border-radius:
        6px;

    background:
        #e0f2fe;

    color:
        #075985;

    font-size:
        10px;

    font-weight:
        bold;

    flex-shrink:
        0;

}


/* =====================================================
   SELECTED COUNT
   ===================================================== */

.selected-count {

    margin:
        17px 0;

    text-align:
        center;

    font-size:
        17px;

    font-weight:
        bold;

    color:
        #075985;

}


/* =====================================================
   STATUS
   ===================================================== */

.status {

    display:
        none;

    margin-top:
        13px;

    padding:
        13px;

    border-radius:
        10px;

    text-align:
        center;

    font-size:
        14px;

    line-height:
        1.4;

}


.status.info {

    display:
        block;

    background:
        #e0f2fe;

    color:
        #075985;

}


.status.success {

    display:
        block;

    background:
        #dcfce7;

    color:
        #166534;

}


.status.error {

    display:
        block;

    background:
        #fee2e2;

    color:
        #991b1b;

}


/* =====================================================
   FOOTER
   ===================================================== */

.footer {

    text-align:
        center;

    padding:
        30px 10px;

    color:
        #64748b;

    font-size:
        13px;

    line-height:
        1.7;

}


.copyright {

    margin-top:
        10px;

    font-size:
        12px;

    color:
        #475569;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

    .header {

        padding:
            23px 12px 26px;

    }


    .header h1 {

        font-size:
            23px;

    }


    .header p {

        font-size:
            14px;

    }


    .container {

        padding:
            10px;

    }


    .card {

        padding:
            16px;

    }


    #srn {

        font-size:
            17px;

    }


    .file-name {

        font-size:
            14px;

    }


    .file-type {

        font-size:
            9px;

    }


    button {

        font-size:
            15px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
     ===================================================== -->

<div class="header">

    <h1>
        💻 Operating Systems
    </h1>

    <p>
        Problems & Programs
    </p>

</div>



<div class="container">


<!-- =====================================================
     SRN CARD
     ===================================================== -->

<div class="card">


    <label
        class="label"
        for="srn">

        Enter Your Complete SRN

    </label>


    <input
        id="srn"
        type="text"
        placeholder="Example: PES1UG23CS001"
        maxlength="13"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
    >


    <button
        id="submitButton"
        class="submit-button"
        onclick="loadFiles()">

        🔍 SUBMIT

    </button>


    <div
        id="status"
        class="status">

    </div>


</div>



<!-- =====================================================
     FILE CARD
     ===================================================== -->

<div
    id="fileCard"
    class="card"
    style="display:none;"
>


    <!-- WELCOME -->

    <div
        id="welcome"
        class="welcome">

    </div>


    <h2>
        📂 Available Files
    </h2>


    <div
        id="fileInfo"
        class="file-info">

    </div>


    <!-- SELECT ALL -->

    <button
        class="select-button"
        onclick="selectAllFiles()">

        ☑️ SELECT ALL

    </button>


    <!-- CLEAR ALL -->

    <button
        class="select-button"
        onclick="clearAllFiles()">

        ⬜ CLEAR ALL

    </button>


    <!-- SELECTED COUNT -->

    <div
        id="selectedCount"
        class="selected-count">

        Selected Files: 0

    </div>


    <!-- FILE LIST -->

    <div
        id="fileList"
        class="file-list">

    </div>


    <!-- DOWNLOAD -->

    <button
        id="downloadButton"
        class="download-button"
        onclick="downloadSelectedFiles()"
        disabled>

        📥 DOWNLOAD SELECTED FILES

    </button>


</div>



<!-- =====================================================
     FOOTER
     ===================================================== -->

<div class="footer">

    <strong>
        3 Sem CSE (AI & ML)
    </strong>

    <br>

    Operating Systems

    <br>

    PES University


    <div class="copyright">

        © 2026 Selva Kumar. All Rights Reserved.

        <br>

        For Educational Use Only.

    </div>

</div>


</div>



<script>


/* =========================================================
   GITHUB CONFIGURATION
   ========================================================= */


const OWNER =
    "selvakumar83";


const REPOSITORY =
    "UE25CS242A-Operating-Systems-Problems-and-Programs";


const BRANCH =
    "main";


/* =========================================================
   COMPLETE SRN FORMAT
   =========================================================

   Example:

   PES1UG23CS001

   ========================================================= */

const SRN_PATTERN =
    /^PES1UG\d{2}[A-Z]{2}\d{3}$/;


/* =========================================================
   VARIABLES
   ========================================================= */

let availableFiles = [];

let studentSRN = "";


/* =========================================================
   LOAD FILES
   ========================================================= */

async function loadFiles() {


    /* -----------------------------------------------------
       GET SRN
       ----------------------------------------------------- */

    const input =
        document.getElementById(
            "srn"
        );


    studentSRN =
        input.value
        .trim()
        .toUpperCase();


    /* -----------------------------------------------------
       EMPTY
       ----------------------------------------------------- */

    if (
        studentSRN === ""
    ) {

        showStatus(
            "Please enter your complete SRN.",
            "error"
        );

        input.focus();

        return;

    }


    /* -----------------------------------------------------
       VALIDATE COMPLETE SRN
       ----------------------------------------------------- */

    if (
        !SRN_PATTERN.test(
            studentSRN
        )
    ) {

        showStatus(
            "Please enter your complete SRN. " +
            "Example: PES1UG23CS001",
            "error"
        );

        input.focus();

        return;

    }


    /* -----------------------------------------------------
       BUTTON
       ----------------------------------------------------- */

    const submitButton =
        document.getElementById(
            "submitButton"
        );


    submitButton.disabled =
        true;


    submitButton.textContent =
        "⏳ LOADING...";


    showStatus(
        "Reading files from GitHub...",
        "info"
    );


    try {


        /* =================================================
           GITHUB CONTENTS API

           Reads repository files automatically.
           ================================================= */


        const apiURL =
            "https://api.github.com/repos/" +
            OWNER +
            "/" +
            REPOSITORY +
            "/contents/?ref=" +
            BRANCH;


        const response =
            await fetch(
                apiURL,
                {
                    cache:
                        "no-store",

                    headers: {
                        "Accept":
                            "application/vnd.github+json"
                    }
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "GitHub repository unavailable."
            );

        }


        const rootItems =
            await response.json();


        /* =================================================
           CLEAR PREVIOUS FILES
           ================================================= */

        availableFiles = [];


        /* =================================================
           PROCESS ROOT
           ================================================= */

        for (
            const item of rootItems
        ) {


            /*
            If it is a file
            */

            if (
                item.type ===
                "file"
            ) {

                addFile(
                    item
                );

            }


            /*
            If it is a folder

            Search inside it.
            */

            else if (
                item.type ===
                "dir"
            ) {

                await scanFolder(
                    item.path
                );

            }

        }


        /* =================================================
           REMOVE DUPLICATES
           ================================================= */

        availableFiles =
            availableFiles.filter(
                function(
                    file,
                    index,
                    array
                ) {

                    return (
                        index ===
                        array.findIndex(
                            function(other) {

                                return (
                                    other.path ===
                                    file.path
                                );

                            }
                        )
                    );

                }
            );


        /* =================================================
           SORT
           ================================================= */

        availableFiles.sort(
            function(a, b) {

                return a.name.localeCompare(
                    b.name,
                    undefined,
                    {
                        numeric:
                            true,

                        sensitivity:
                            "base"
                    }
                );

            }
        );


        /* =================================================
           CHECK
           ================================================= */

        if (
            availableFiles.length === 0
        ) {

            throw new Error(
                "No files found in repository."
            );

        }


        /* =================================================
           DISPLAY
           ================================================= */

        displayFiles();


        /* =================================================
           SHOW CARD
           ================================================= */

        document
            .getElementById(
                "fileCard"
            )
            .style.display =
            "block";


        /* =================================================
           WELCOME
           ================================================= */

        document
            .getElementById(
                "welcome"
            )
            .textContent =
            "Welcome, " +
            studentSRN;


        /* =================================================
           COUNT
           ================================================= */

        document
            .getElementById(
                "fileInfo"
            )
            .textContent =
            availableFiles.length +
            " files available";


        /* =================================================
           SUCCESS
           ================================================= */

        showStatus(
            "All files loaded successfully.",
            "success"
        );

    }


    catch(error) {


        console.error(
            error
        );


        showStatus(
            "Unable to load files from GitHub. " +
            "Please try again.",
            "error"
        );

    }


    finally {


        submitButton.disabled =
            false;


        submitButton.textContent =
            "🔍 SUBMIT";

    }

}


/* =========================================================
   SCAN FOLDER
   ========================================================= */

async function scanFolder(
    folderPath
) {


    const encodedFolder =
        folderPath
        .split("/")
        .map(
            function(part) {

                return encodeURIComponent(
                    part
                );

            }
        )
        .join("/");


    const folderURL =
        "https://api.github.com/repos/" +
        OWNER +
        "/" +
        REPOSITORY +
        "/contents/" +
        encodedFolder +
        "?ref=" +
        BRANCH;


    const response =
        await fetch(
            folderURL,
            {
                cache:
                    "no-store",

                headers: {
                    "Accept":
                        "application/vnd.github+json"
                }
            }
        );


    if (
        !response.ok
    ) {

        return;

    }


    const items =
        await response.json();


    for (
        const item of items
    ) {


        if (
            item.type ===
            "file"
        ) {

            addFile(
                item
            );

        }


        else if (
            item.type ===
            "dir"
        ) {

            await scanFolder(
                item.path
            );

        }

    }

}


/* =========================================================
   ADD EVERY FILE
   ========================================================= */

function addFile(
    item
) {


    /*
    Actual GitHub filename
    */

    const filename =
        item.name;


    /*
    Don't show the website itself
    */

    if (
        filename
        .toLowerCase()
        ===
        "index.html"
    ) {

        return;

    }


    /*
    We want EVERY OTHER FILE.

    No extension filtering.

    PDF
    DOC
    DOCX
    PPT
    PPTX
    C
    CPP
    JAVA
    PY
    TXT
    ZIP
    JPG
    PNG
    etc.

    Everything is supported.
    */


    /*
    File extension
    */

    let extension =
        "";


    const dot =
        filename.lastIndexOf(".");


    if (
        dot !== -1
    ) {

        extension =
            filename
            .substring(
                dot + 1
            )
            .toUpperCase();

    }


    /*
    Add
    */

    availableFiles.push({

        name:
            filename,

        path:
            item.path,

        extension:
            extension,

        downloadURL:
            item.download_url

    });

}


/* =========================================================
   DISPLAY FILES
   ========================================================= */

function displayFiles() {


    const fileList =
        document.getElementById(
            "fileList"
        );


    fileList.innerHTML =
        "";


    availableFiles.forEach(
        function(
            file,
            index
        ) {


            /* ---------------------------------------------
               ROW
               --------------------------------------------- */

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "file-item";


            /* ---------------------------------------------
               CHECKBOX
               --------------------------------------------- */

            const checkbox =
                document.createElement(
                    "input"
                );


            checkbox.type =
                "checkbox";


            checkbox.className =
                "file-checkbox";


            checkbox.dataset.index =
                index;


            checkbox.addEventListener(
                "change",
                updateSelectedCount
            );


            /* ---------------------------------------------
               ACTUAL FILENAME
               --------------------------------------------- */

            const name =
                document.createElement(
                    "span"
                );


            name.className =
                "file-name";


            name.textContent =
                file.name;


            /* ---------------------------------------------
               TYPE
               --------------------------------------------- */

            const type =
                document.createElement(
                    "span"
                );


            type.className =
                "file-type";


            type.textContent =
                file.extension ||
                "FILE";


            /* ---------------------------------------------
               ADD
               --------------------------------------------- */

            row.appendChild(
                checkbox
            );


            row.appendChild(
                name
            );


            row.appendChild(
                type
            );


            fileList.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   SELECT ALL
   ========================================================= */

function selectAllFiles() {


    document
        .querySelectorAll(
            ".file-checkbox"
        )
        .forEach(
            function(checkbox) {

                checkbox.checked =
                    true;

            }
        );


    updateSelectedCount();

}


/* =========================================================
   CLEAR ALL
   ========================================================= */

function clearAllFiles() {


    document
        .querySelectorAll(
            ".file-checkbox"
        )
        .forEach(
            function(checkbox) {

                checkbox.checked =
                    false;

            }
        );


    updateSelectedCount();

}


/* =========================================================
   SELECTED COUNT
   ========================================================= */

function updateSelectedCount() {


    const selected =
        document.querySelectorAll(
            ".file-checkbox:checked"
        );


    document
        .getElementById(
            "selectedCount"
        )
        .textContent =
        "Selected Files: " +
        selected.length;


    document
        .getElementById(
            "downloadButton"
        )
        .disabled =
        selected.length === 0;

}


/* =========================================================
   DOWNLOAD SELECTED FILES
   ========================================================= */

async function downloadSelectedFiles() {


    const selected =
        Array.from(
            document.querySelectorAll(
                ".file-checkbox:checked"
            )
        );


    if (
        selected.length === 0
    ) {

        alert(
            "Please select at least one file."
        );

        return;

    }


    const button =
        document.getElementById(
            "downloadButton"
        );


    button.disabled =
        true;


    /* =====================================================
       DIRECT DOWNLOAD

       NO ZIP
       NO CONVERSION
       ===================================================== */


    for (
        let i = 0;
        i < selected.length;
        i++
    ) {


        const checkbox =
            selected[i];


        const index =
            Number(
                checkbox.dataset.index
            );


        const file =
            availableFiles[index];


        /* ---------------------------------------------
           Progress
           --------------------------------------------- */

        button.textContent =
            "⬇️ Downloading " +
            (i + 1) +
            " / " +
            selected.length;


        /* ---------------------------------------------
           Create download link
           --------------------------------------------- */

        const link =
            document.createElement(
                "a"
            );


        link.href =
            file.downloadURL;


        /*
        Preserve original filename
        */

        link.download =
            file.name;


        link.target =
            "_blank";


        link.rel =
            "noopener";


        /* ---------------------------------------------
           Start download
           --------------------------------------------- */

        document
            .body
            .appendChild(
                link
            );


        link.click();


        document
            .body
            .removeChild(
                link
            );


        /*
        Delay between files.

        Helps mobile browsers.
        */

        await delay(
            1200
        );

    }


    /* =====================================================
       RESET
       ===================================================== */

    button.textContent =
        "📥 DOWNLOAD SELECTED FILES";


    button.disabled =
        false;


    showStatus(
        "Selected files downloaded.",
        "success"
    );

}


/* =========================================================
   DELAY
   ========================================================= */

function delay(
    milliseconds
) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                milliseconds
            );

        }
    );

}


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(
    message,
    type
) {


    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.className =
        "status " +
        type;


    status.style.display =
        "block";

}


/* =========================================================
   ENTER KEY
   ========================================================= */

document
    .getElementById(
        "srn"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                loadFiles();

            }

        }
    );


/* =========================================================
   AUTOMATIC UPPERCASE
   ========================================================= */

document
    .getElementById(
        "srn"
    )
    .addEventListener(
        "input",
        function() {

            this.value =
                this.value
                .toUpperCase();

        }
    );

</script>


</body>

</html>
